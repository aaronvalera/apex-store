<!DOCTYPE html>
<html lang="en" data-theme="apex-light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="/images/apex-logo.png">
        <link rel="stylesheet" href="/public/output.css">
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
        <title>Order Confirmation | APEX</title>
    </head>
    <body class="bg-gray-50 min-h-screen flex flex-col font-sans antialiased text-gray-900">
        <!-- Navbar Container -->
        <nav class="navbar fixed top-0 left-0 w-full z-10 p-2"></nav>
        <!-- Main Content -->
        <main class="flex-1 flex items-center justify-center p-4 pt-24 pb-12">
            <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center space-y-6">
                <!-- Status icon container -->
                <div id="status-icon-container" class="w-16 h-16 bg-gray-100 text-gray-600 rounded-full flex items-center justify-center mx-auto shadow-sm transition-all duration-300">
                    <svg class="animate-spin h-8 w-8 text-gray-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
                <!-- Title and message -->
                <div class="space-y-2">
                    <h1 id="confirmation-title" class="text-2xl font-extrabold tracking-tight text-gray-900">Verifying your order...</h1>
                    <p id="confirmation-subtitle" class="text-xs text-gray-500">Please wait while we confirm your payment details.</p>
                </div>
                <!-- Order Summary Container -->
                <div id="payment-ref-container" class="bg-gray-50 rounded-xl p-4 border border-gray-100 text-left space-y-3 hidden">
                    <div class="flex justify-between items-center border-b border-gray-200/60 pb-2.5">
                        <span class="text-[10px] font-bold tracking-wider text-gray-400 uppercase shrink-0">Order Number</span>
                        <span id="order-number" class="text-xs font-mono font-bold text-gray-900 text-right"></span>
                    </div>
                    <div class="flex justify-between items-center border-b border-gray-200/60 pb-2.5">
                        <span class="text-[10px] font-bold tracking-wider text-gray-400 uppercase shrink-0">Date & Time</span>
                        <span id="order-date" class="text-[11px] font-medium text-gray-700 text-right pl-2"></span>
                    </div>
                    <div class="flex justify-between items-center border-b border-gray-200/60 pb-2.5">
                        <span class="text-[10px] font-bold tracking-wider text-gray-400 uppercase shrink-0">Total Paid</span>
                        <span id="order-total" class="text-xs font-extrabold text-emerald-600 text-right"></span>
                    </div>
                    <div class="pt-1 space-y-1">
                        <span class="text-[10px] font-bold tracking-wider text-gray-400 uppercase block">Payment Reference</span>
                        <span id="payment-intent-id" class="text-[11px] font-mono font-medium text-gray-600 break-all block bg-white p-2 rounded-lg border border-gray-200/50"></span>
                    </div>
                </div>
                <!-- Action button -->
                <div class="pt-2 space-y-3">
                    <a href="/catalog" class="btn btn-neutral w-full rounded-xl text-xs font-bold uppercase tracking-wider">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </main>
        <script type="module" src="/confirmation/index.js"></script>
    </body>
</html>
