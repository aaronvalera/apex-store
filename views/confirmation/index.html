<!DOCTYPE html>
<html lang="en" data-theme="apex-light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="/images/apex-logo.png">
        <link rel="stylesheet" href="/public/output.css">
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
        <title>Order Confirmation | APEX</title>
    </head>
    <body class="bg-gray-50 min-h-screen flex flex-col font-sans antialiased text-gray-900">
        <!-- Navbar Container -->
        <nav class="navbar fixed z-1 p-2"></nav>
        <!-- Main Content -->
        <main class="flex-1 flex items-center justify-center p-4">
            <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center space-y-6">
                <!-- Success icon -->
                <div class="w-16 h-16 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 stroke-current" fill="none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <!-- Title and message -->
                <div class="space-y-2">
                    <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">Thank you for your order!</h1>
                    <p class="text-xs text-gray-500">We've received your payment and are processing your order.</p>
                </div>
                <!-- Payment details / Payment Intent ID -->
                <div class="bg-gray-50 rounded-xl p-4 border border-gray-100 text-left space-y-2">
                    <p class="text-[10px] font-bold tracking-wider text-gray-400 uppercase">Payment Reference</p>
                    <p id="payment-intent-id" class="text-xs font-mono font-medium text-gray-700 break-all">Loading reference...</p>
                </div>
                <!-- Action button -->
                <div class="pt-2 space-y-3">
                    <a href="/catalog" class="btn btn-neutral w-full rounded-xl text-xs font-bold uppercase tracking-wider">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </main>
        <script type="module" src="/confirmation/index.js"></script>
    </body>
</html>
