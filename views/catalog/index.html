<!DOCTYPE html>
<html lang="en" data-theme="apex-light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/public/output.css">
        <link rel="icon" type="image/png" href="/images/apex-logo.png">
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
        <title>Catalog — APEX</title>
    </head>
    <body>
        <header class="sticky top-0 z-10 w-full bg-base-100 border-b border-base-200">
            <nav class="navbar p-2"></nav>
        </header>
        <div class="drawer lg:drawer-open flex-1">
            <input id="filter-drawer" type="checkbox" class="drawer-toggle"/>
            <div class="drawer-content flex flex-col p-4 lg:p-8 lg:py-2">
                <!-- Upper bar of control (Mobile toggle + sorting) -->
                <label for="filter-drawer" class="btn btn-neutral btn-sm fixed bottom-6 right-6 z-30 lg:hidden shadow-xl gap-2 rounded-full px-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
                    </svg>
                    Filters
                </label>
                <!-- Grid of producs -->
                <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6 mt-6"></div>
                <!-- Pagination -->
                <div class="flex justify-center mt-12 w-full overflow-x-auto py-2">
                    <div id="pagination" class="join flex-wrap justify-center">
                        <button class="join-item btn btn-xs sm:btn-sm btn-disabled">«</button>
                        <button class="join-item btn btn-xs sm:btn-sm btn-active btn-neutral">1</button>
                        <button class="join-item btn btn-xs sm:btn-sm">2</button>
                        <button class="join-item btn btn-xs sm:btn-sm">3</button>
                        <button class="join-item btn btn-xs sm:btn-sm">»</button>
                    </div>
                </div>
                <span id="products-count" class="text-sm text-center opacity-70">Showing 24 products</span>
            </div> 
            <!-- Sidebar of filters (Drawer side) -->
            <div class="drawer-side z-1 top-16 h-[calc(100vh-4rem)] lg:top-0 lg:h-auto">
                <label for="filter-drawer" class="drawer-overlay"></label>
                <aside class="w-80 min-h-full bg-base-100 p-6 text-base-content border-r border-base-200 space-y-6">
                    <h2 class="text-xl font-bold uppercase tracking-wider">Filters</h2>
                    <!-- Sort by -->
                    <div class="collapse collapse-arrow border-b border-base-200 rounded-none">
                        <input type="checkbox" checked/> 
                        <div class="collapse-title text-sm font-bold uppercase px-0">Sort By</div>
                        <div class="collapse-content px-0">
                            <select class="select select-bordered select-sm w-full sort-select-input">
                                <option value="" disabled selected>Sort order</option>
                                <option value="newest">Newest</option>
                                <option value="price-asc">Price: Low to High</option>
                                <option value="price-desc">Price: High to Low</option>
                            </select>
                        </div>
                    </div>
                    <!-- Categories -->
                    <div class="collapse collapse-arrow border-b border-base-200 rounded-none">
                        <input type="checkbox" checked/> 
                        <div class="collapse-title text-sm font-bold uppercase px-0">Category</div>
                        <div class="collapse-content px-0 space-y-2">  
                            <label class="label cursor-pointer justify-start gap-3 py-1">
                                <input type="radio" name="category" class="radio radio-sm" value="men"/>
                                <span class="label-text">Men</span>
                            </label>
                            <label class="label cursor-pointer justify-start gap-3 py-1">
                                <input type="radio" name="category" class="radio radio-sm" value="women"/>
                                <span class="label-text">Women</span>
                            </label>
                            <label class="label cursor-pointer justify-start gap-3 py-1">
                                <input type="radio" name="category" class="radio radio-sm" value="kids"/>
                                <span class="label-text">Kids</span>
                            </label>
                        </div>
                    </div>
                    <!-- Sizes -->
                    <div class="collapse collapse-arrow border-b border-base-200 rounded-none">
                        <input type="checkbox" checked/> 
                        <div class="collapse-title text-sm font-bold uppercase px-0">Size</div>
                        <div class="collapse-content px-0">
                            <div class="grid grid-cols-3 gap-2">
                                <button class="btn size-btn btn-outline btn-xs" data-size="XS">XS</button>
                                <button class="btn size-btn btn-outline btn-xs" data-size="S">S</button>
                                <button class="btn size-btn btn-outline btn-xs" data-size="M">M</button>
                                <button class="btn size-btn btn-outline btn-xs" data-size="L">L</button>
                                <button class="btn size-btn btn-outline btn-xs" data-size="XL">XL</button>
                                <button class="btn size-btn btn-outline btn-xs" data-size="XXL">XXL</button>
                            </div>
                        </div>
                    </div>
                    <!-- Prices range -->
                    <div class="collapse collapse-arrow border-b border-base-200 rounded-none">
                        <input type="checkbox" checked/> 
                        <div class="collapse-title text-sm font-bold uppercase px-0">Max Price</div>
                        <div class="collapse-content px-0 space-y-3">
                            <input type="range" min="10" max="200" value="100" class="range range-xs price-range-input"/>
                            <div class="flex justify-between text-xs opacity-70">
                                <span>$10</span>
                                <span class="font-bold text-base-content price-display-text">$100</span>
                                <span>$200</span>
                            </div>
                        </div>
                    </div>
                    <!-- Apply filters button -->
                    <button class="btn btn-block btn-neutral btn-sm apply-filters-btn">APPLY FILTERS</button>
                </aside>
            </div>
        </div>
        <div class="footer bg-base-200 text-base-content rounded-t-md mt-20"></div>
        <script src="/components/footer.js"></script>
        <script type="module" src="/catalog/index.js"></script>
    </body>
</html>
