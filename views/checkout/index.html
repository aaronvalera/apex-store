<!DOCTYPE html>
<html lang="en" data-theme="apex-light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="/images/apex-logo.png">
        <link rel="stylesheet" href="/public/output.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@24.5.0/build/css/intlTelInput.css">
        <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
        <script src="https://js.stripe.com/v3/"></script>
        <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@24.5.0/build/js/intlTelInput.min.js"></script>
        <title>Checkout | APEX Store</title>
    </head>
    <body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col overflow-x-hidden">
        <nav class="navbar relative z-10 p-2"></nav>
        <div id="notification" class="fixed z-50 text-center top-20 right-0 mx-4 py-5 transition-all ease-in-out duration-700 opacity-0 translate-x-5 pointer-events-none"></div>
        <!-- Layout of checkout -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 w-full flex-1 overflow-x-hidden">
            <h1 class="text-2xl sm:text-3xl font-black uppercase tracking-tight text-gray-900 mb-6 sm:mb-8">Checkout</h1>
            <form id="checkout-form" class="flex flex-col lg:grid lg:grid-cols-12 gap-8 sm:gap-12 w-full max-w-full">
                <!-- Right column: summary of order (Order 1 in mobile, Column 2 in desktop) -->
                <div class="order-1 lg:order-2 lg:col-span-5 w-full max-w-full">
                    <div class="bg-white p-6 sm:p-8 rounded-2xl border border-gray-200 shadow-sm lg:sticky lg:top-8 space-y-6">
                        <h2 class="text-lg font-bold text-gray-900 uppercase tracking-wider border-b border-gray-100 pb-4">Order Summary</h2>
                        <!-- Dynamic list of products in the cart -->
                        <div id="checkout-cart-items" class="space-y-4 max-h-80 overflow-y-auto pr-1"></div>
                        <hr class="border-gray-100">
                        <!-- Totals -->
                        <div class="space-y-3 text-sm">
                            <div class="flex justify-between text-gray-600">
                                <span>Subtotal</span>
                                <span id="summary-subtotal" class="font-medium text-gray-900">$0.00</span>
                            </div>
                            <div class="flex justify-between text-gray-600">
                                <span>Shipping</span>
                                <span id="summary-shipping" class="font-medium text-emerald-600">FREE</span>
                            </div>
                            <div class="flex justify-between text-gray-600">
                                <span>Taxes</span>
                                <span id="summary-taxes" class="font-medium text-gray-900">$0.00</span>
                            </div>
                            <hr class="border-gray-100 my-2">
                            <div class="flex justify-between text-base font-black text-gray-900 uppercase tracking-wider">
                                <span>Total</span>
                                <span id="summary-total">$0.00</span>
                            </div>
                        </div>
                        <!-- Pay button / Submit -->
                        <button type="submit" id="submit-pay-btn" class="btn btn-neutral w-full rounded-xl py-4 bg-black hover:bg-gray-800 text-white font-bold text-sm uppercase tracking-wider transition-all shadow-md">
                            <span id="btn-text">Pay Now</span>
                            <span id="btn-spinner" class="loading loading-spinner loading-sm hidden"></span>
                        </button>
                        <!-- Selos of security -->
                        <div class="flex items-center justify-center gap-2 text-xs text-gray-400 font-medium pt-2">
                            <svg class="w-4 h-4 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                            </svg>
                            Encrypted 256-bit SSL Payment
                        </div>
                    </div>
                </div>
                <!-- Left column: form of shipment and payment (Order 2 in mobile, Column 1 in desktop) -->
                <div class="order-2 lg:order-1 lg:col-span-7 space-y-8 w-full max-w-full">
                    <!-- Section: shipment information -->
                    <section class="bg-white p-6 sm:p-8 rounded-2xl border border-gray-200 shadow-sm space-y-6">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-4 flex-wrap gap-2">
                            <h2 class="text-lg font-bold text-gray-900 uppercase tracking-wider">1. Shipping Address</h2>
                            <span id="user-email-badge" class="text-xs text-gray-500 font-medium truncate"></span>
                        </div>
                        <!-- Saved addresses list wrapper -->
                        <div id="saved-addresses-wrapper" class="hidden space-y-4">
                            <p class="text-xs font-bold text-gray-700 uppercase tracking-wider">Select a saved address</p>
                            <div id="saved-addresses-list" class="space-y-3 max-w-full"></div>
                            <button type="button" id="toggle-new-address-btn" class="btn btn-ghost btn-xs text-black border border-gray-300 hover:bg-gray-100 font-bold uppercase tracking-wider mt-2">
                                + Add New Address
                            </button>
                        </div>
                        <!-- Address form fields -->
                        <div id="address-form-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Address Title / Label *</label>
                                <input type="text" id="address-title" class="input input-bordered w-full rounded-xl focus:outline-none focus:border-black text-sm" placeholder="e.g. Home, Office, Apartment">
                            </div>
                            <div class="sm:col-span-1">
                                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">First Name *</label>
                                <input type="text" id="first-name" class="input input-bordered w-full rounded-xl focus:outline-none focus:border-black text-sm" placeholder="John">
                            </div>
                            <div class="sm:col-span-1">
                                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Last Name *</label>
                                <input type="text" id="last-name" class="input input-bordered w-full rounded-xl focus:outline-none focus:border-black text-sm" placeholder="Doe">
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Street Address *</label>
                                <input type="text" id="address" class="input input-bordered w-full rounded-xl focus:outline-none focus:border-black text-sm" placeholder="123 Main Street, Apt 4B">
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Address Details / Reference (Optional)</label>
                                <input type="text" id="address-details" class="input input-bordered w-full rounded-xl focus:outline-none focus:border-black text-sm" placeholder="Apt 4B, Near Central Park">
                            </div>
                            <div class="sm:col-span-1">
                                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">City *</label>
                                <input type="text" id="city" class="input input-bordered w-full rounded-xl focus:outline-none focus:border-black text-sm" placeholder="New York">
                            </div>
                            <div class="sm:col-span-1">
                                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">State / Province *</label>
                                <input type="text" id="state" class="input input-bordered w-full rounded-xl focus:outline-none focus:border-black text-sm" placeholder="NY">
                            </div>
                            <div class="sm:col-span-1">
                                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Postal Code *</label>
                                <input type="text" id="postal-code" class="input input-bordered w-full rounded-xl focus:outline-none focus:border-black text-sm" placeholder="10001">
                            </div>
                            <div class="sm:col-span-1">
                                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Country *</label>
                                <input type="text" id="country" class="input input-bordered w-full rounded-xl focus:outline-none focus:border-black text-sm" placeholder="United States">
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Phone Number *</label>
                                <input type="tel" id="phone" class="input input-bordered w-full rounded-xl focus:outline-none focus:border-black text-sm">
                            </div>
                        </div>
                    </section>
                    <!-- Section: payment method (Stripe Element Container) -->
                    <section class="bg-white p-6 sm:p-8 rounded-2xl border border-gray-200 shadow-sm space-y-6">
                        <h2 class="text-lg font-bold text-gray-900 uppercase tracking-wider border-b border-gray-100 pb-4">2. Payment Details</h2>
                        <!-- Container where Stripe will inject the form -->
                        <div id="payment-element" class="min-h-37.5 py-2 w-full max-w-full overflow-hidden">
                            <!-- Spinner while loads the SDK of Stripe -->
                            <div id="stripe-loading" class="flex justify-center items-center py-8">
                                <span class="loading loading-spinner loading-md text-black"></span>
                            </div>
                        </div>
                    </section>
                </div>
            </form>
        </main>
        <script type="module" src="/checkout/index.js"></script>
    </body>
</html>
